server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Security headers ───────────────────────────────────
    # (supplemented by Dockerfile add_header directives)

    # ── Static assets — long cache ─────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA fallback — all routes to index.html ───────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy API requests to backend API container ────────
    # Replace https://api.memoir.example.com/api/v1 at build time
    # via --build-arg VITE_API_BASE_URL
    location /api/ {
        proxy_pass https://api.memoir.example.com/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── Health check ───────────────────────────────────────
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
