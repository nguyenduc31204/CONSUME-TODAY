# ─────────────────────────────────────────────────────────────
# MemoirFinance — GitHub Actions CI/CD
#
# CI: lint → type-check → test (mọi push/PR)
# CD Backend: Docker build & push → deploy via SSH
#   (Frontend: Vercel tự deploy khi push, không cần job này)
#
# Secrets needed (Settings → Secrets and variables → Actions):
#   SSH_HOST       — IP/domain production server
#   SSH_USER       — SSH user (e.g. root)
#   SSH_KEY       — Private SSH key
#   SSH_PORT       — SSH port (default: 22)
#
# Variables needed (Settings → Secrets and variables → Actions → Variables):
#   BACKEND_SSH_PATH  — path to repo on server (e.g. /opt/memoir)
# ─────────────────────────────────────────────────────────────

name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  # ────────────────────────────────────────────────────────────
  # Backend CI — lint, test
  # ────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: memoirfinance_test
          POSTGRES_USER: memoir
          POSTGRES_PASSWORD: memoir
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install httpx

      - name: Lint with ruff
        run: ruff check src/

      - name: Format check
        run: ruff format --check src/

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql+asyncpg://memoir:memoir@localhost:5432/memoirfinance_test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: memoirfinance_test
          DB_USER: memoir
          DB_PASSWORD: memoir
          JWT_PRIVATE_KEY: test_private_key_for_ci_only_not_production
          JWT_PUBLIC_KEY: test_public_key_for_ci_only_not_production
          APP_SECRET_KEY: test_secret_key_for_ci_only_not_production
          GOOGLE_CLIENT_ID: ""
          GOOGLE_CLIENT_SECRET: ""
          ANTHROPIC_API_KEY: ""
          R2_ACCOUNT_ID: ""
          R2_ACCESS_KEY_ID: ""
          R2_SECRET_ACCESS_KEY: ""
          R2_BUCKET_NAME: ""
          R2_PUBLIC_URL: ""
        run: pytest tests/unit/ -v --tb=short

  # ────────────────────────────────────────────────────────────
  # Frontend CI — lint, type-check, build
  # ────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npm run lint -- --max-warnings 50

      - name: Type-check with TypeScript
        run: npx tsc --noEmit

      - name: Build for production
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_APP_ENV: production
        run: npm run build

  # ────────────────────────────────────────────────────────────
  # Deploy Backend — Docker build → deploy via SSH
  # Chạy sau khi CI pass, chỉ khi push vào main
  # Frontend: Vercel tự deploy qua GitHub integration
  # ────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            docker.io/${{ secrets.DOCKER_USERNAME }}/memoir-backend:${{ github.sha }}
            docker.io/${{ secrets.DOCKER_USERNAME }}/memoir-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}

      - name: Deploy to production server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: github.sha,github.repository_owner
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          script: |
            set -e
            APP_DIR="${{ vars.BACKEND_SSH_PATH || '/opt/memoir' }}"
            REGISTRY="docker.io/${{ secrets.DOCKER_USERNAME }}"

            echo "📦 Pulling new backend image..."
            docker pull "${REGISTRY}/memoir-backend:${{ github.sha }}"

            echo "🏷️  Tagging image..."
            docker tag "${REGISTRY}/memoir-backend:${{ github.sha }}" \
                "${REGISTRY}/memoir-backend:latest"

            echo "📁 Updating code on server..."
            cd "${APP_DIR}"
            # Use GitHub token for private repo access
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            git fetch origin main
            git reset --hard origin/main

            echo "🚀 Restarting backend..."
            sed -i "s|image: docker.io/.*memoir-backend:.*|image: ${REGISTRY}/memoir-backend:${{ github.sha }}|" docker-compose.prod.yml
            docker compose -f docker-compose.prod.yml up -d --no-deps backend

            echo "✅ Backend deployed! SHA: ${{ github.sha }}"
