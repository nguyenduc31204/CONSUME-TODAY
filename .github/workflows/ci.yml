# ─────────────────────────────────────────────────────────────
# MemoirFinance — GitHub Actions CI/CD
#
# CI: lint → type-check → test (on every push/PR)
# CD: build Docker images → push to registry → deploy (on push to main)
#
# Required secrets (Settings → Secrets and variables → Actions):
#   DOCKER_USERNAME        Docker Hub / GHCR username
#   DOCKER_PASSWORD        Access token / PAT
#   SSH_HOST               Production server host
#   SSH_USER               SSH user
#   SSH_KEY                Private SSH key
#
# Required variables (Settings → Secrets and variables → Actions → Variables):
#   VITE_API_BASE_URL      Public API URL (e.g. https://api.yourdomain.com/api/v1)
#
# Optional:
#   DOCKER_REGISTRY        defaults to ghcr.io (GitHub Container Registry)
#   IMAGE_PREFIX           defaults to $DOCKER_USERNAME/memoir
# ─────────────────────────────────────────────────────────────

name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/memoir
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  # ────────────────────────────────────────────────────────────
  # Backend CI — lint, test
  # ────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: memoirfinance_test
          POSTGRES_USER: memoir
          POSTGRES_PASSWORD: memoir
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install httpx  # for backend health in CI

      # ── Lint ──────────────────────────────────────────────
      - name: Lint with ruff
        run: ruff check src/

      # ── Type-check (ruff) ─────────────────────────────────
      - name: ruff format check
        run: ruff format --check src/

      # ── Test ──────────────────────────────────────────────
      - name: Run unit tests
        env:
          DATABASE_URL: postgresql+asyncpg://memoir:memoir@localhost:5432/memoirfinance_test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: memoirfinance_test
          DB_USER: memoir
          DB_PASSWORD: memoir
          JWT_PRIVATE_KEY: test_private_key_for_ci_only_not_production
          JWT_PUBLIC_KEY: test_public_key_for_ci_only_not_production
          APP_SECRET_KEY: test_secret_key_for_ci_only_not_production
          GOOGLE_CLIENT_ID: ""
          GOOGLE_CLIENT_SECRET: ""
          ANTHROPIC_API_KEY: ""
          R2_ACCOUNT_ID: ""
          R2_ACCESS_KEY_ID: ""
          R2_SECRET_ACCESS_KEY: ""
          R2_BUCKET_NAME: ""
          R2_PUBLIC_URL: ""
        run: pytest tests/unit/ -v --tb=short

  # ────────────────────────────────────────────────────────────
  # Frontend CI — lint, type-check, build
  # ────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ── Lint ──────────────────────────────────────────────
      - name: Lint with ESLint
        run: npm run lint -- --max-warnings 34

      # ── Type-check ─────────────────────────────────────────
      - name: Type-check with TypeScript
        run: npx tsc --noEmit

      # ── Build ──────────────────────────────────────────────
      - name: Build for production
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.example.com/api/v1' }}
          VITE_APP_ENV: production
        run: npm run build

      # ── Upload build artifact ────────────────────────────────
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # Build & Push Docker Images (on main/master push)
  # ────────────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── Backend image ─────────────────────────────────────
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}

      # ── Frontend image ────────────────────────────────────
      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          target: production
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_APP_ENV=production
            NODE_VERSION=${{ env.NODE_VERSION }}

  # ────────────────────────────────────────────────────────────
  # Deploy to Production Server (on main/master push)
  # ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          echo "${{ secrets.SSH_KEY }}" | base64 -d > deploy_key
          chmod 600 deploy_key

      - name: Copy deployment script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: deploy.sh
          target: /tmp/

      - name: Run deploy script on server
        uses: appleboy/ssh-action@v0.1.11
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            chmod +x /tmp/deploy.sh
            bash /tmp/deploy.sh ${{ github.sha }} ${{ env.DOCKER_REGISTRY }} ${{ env.IMAGE_PREFIX }}

      - name: Deploy summary
        run: |
          echo "✅ Deployment triggered for commit ${{ github.sha }}"
          echo "🌐 App: https://memoir.example.com"
