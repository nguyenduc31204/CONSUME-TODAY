# ─────────────────────────────────────────────────────────────
# MemoirFinance — GitHub Actions CI/CD
#
# CI: lint → type-check → test (mọi push/PR)
# CD Backend: Docker build → push → deploy qua SSH
# CD Frontend: Vercel deploy
#
# Secrets needed (Settings → Secrets and variables → Actions):
#   BACKEND
#     SSH_HOST       — IP/domain production server
#     SSH_USER       — SSH user (e.g. root, ubuntu)
#     SSH_KEY        — Private SSH key (PEM format)
#     SSH_PORT       — SSH port (default: 22)
#
#   FRONTEND
#     VERCEL_TOKEN   — Vercel API token
#     VERCEL_ORG_ID  — Vercel org ID (team/user ID)
#     VERCEL_PROJECT_ID — Vercel project ID
#
# Variables needed (Settings → Secrets and variables → Actions → Variables):
#   VITE_API_BASE_URL  — e.g. https://api.testduc.io.vn/api/v1
#   BACKEND_SSH_PATH   — path to repo on server (e.g. /opt/memoir)
# ─────────────────────────────────────────────────────────────

name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  # ────────────────────────────────────────────────────────────
  # Backend CI — lint, test
  # ────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: memoirfinance_test
          POSTGRES_USER: memoir
          POSTGRES_PASSWORD: memoir
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install httpx  # for backend health in CI

      - name: Lint with ruff
        run: ruff check src/

      - name: Format check
        run: ruff format --check src/

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql+asyncpg://memoir:memoir@localhost:5432/memoirfinance_test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: memoirfinance_test
          DB_USER: memoir
          DB_PASSWORD: memoir
          JWT_PRIVATE_KEY: test_private_key_for_ci_only_not_production
          JWT_PUBLIC_KEY: test_public_key_for_ci_only_not_production
          APP_SECRET_KEY: test_secret_key_for_ci_only_not_production
          GOOGLE_CLIENT_ID: ""
          GOOGLE_CLIENT_SECRET: ""
          ANTHROPIC_API_KEY: ""
          R2_ACCOUNT_ID: ""
          R2_ACCESS_KEY_ID: ""
          R2_SECRET_ACCESS_KEY: ""
          R2_BUCKET_NAME: ""
          R2_PUBLIC_URL: ""
        run: pytest tests/unit/ -v --tb=short

  # ────────────────────────────────────────────────────────────
  # Frontend CI — lint, type-check, build
  # ────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npm run lint -- --max-warnings 34

      - name: Type-check with TypeScript
        run: npx tsc --noEmit

      - name: Build for production
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_APP_ENV: production
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # Deploy Backend — Docker build & push → deploy via SSH
  # Chạy trên mọi push vào main (sau khi backend-ci pass)
  # ────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: backend-ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/memoir-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/memoir-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}

      - name: Deploy to production server via SSH
        uses: appleboy/ssh-action@v0.1.11
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: github.sha,github.repository_owner
          script: |
            set -e
            APP_DIR="${{ vars.BACKEND_SSH_PATH || '/opt/memoir' }}"
            REGISTRY="ghcr.io/${{ github.repository_owner }}"

            echo "📦 Pulling new backend image..."
            docker pull "${REGISTRY}/memoir-backend:${{ github.sha }}"

            echo "🏷️  Tagging image..."
            docker tag "${REGISTRY}/memoir-backend:${{ github.sha }}" \
                "${REGISTRY}/memoir-backend:latest"

            echo "📁 Navigating to app directory..."
            cd "${APP_DIR}"

            echo "🗄️  Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "🚀 Restarting backend container..."
            # Tag the new image in docker-compose context
            sed -i "s|image: ghcr.io.*memoir-backend:.*|image: ${REGISTRY}/memoir-backend:${{ github.sha }}|" docker-compose.prod.yml

            docker compose -f docker-compose.prod.yml up -d --no-deps backend

            echo "✅ Backend deployed! Commit: ${{ github.sha }}"

  # ────────────────────────────────────────────────────────────
  # Deploy Frontend — Vercel
  # Chạy song song với deploy-backend (sau khi frontend-ci pass)
  # ────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: frontend-ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Deploy to Vercel (production)
        run: |
          cd frontend
          # Deploy from dist/ — bypasses build step
          # VERCEL_ORG_ID and VERCEL_PROJECT_ID come from .vercel/project.json
          # if not set via env, use flags
          vercel deploy ./dist \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            ${VERCEL_ORG_ID:+--scope=${{ secrets.VERCEL_ORG_ID }}} \
            ${VERCEL_PROJECT_ID:+--yes}
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_APP_ENV: production
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy summary
        run: |
          echo "✅ Frontend deployed to Vercel!"
          echo "🌐 URL: https://testduc.io.vn"
