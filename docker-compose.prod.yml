# ─────────────────────────────────────────────────────────────
# MemoirFinance — Production Docker Compose
# Backend + PostgreSQL only (Frontend deploys separately on Vercel)
#
# Deploy: docker compose -f docker-compose.prod.yml up -d --build
# ─────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL 16 ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: memoir_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memoirfinance}
      POSTGRES_USER: ${POSTGRES_USER:-memoir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memoir}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memoir} -d ${POSTGRES_DB:-memoirfinance}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - memoir

  # ── Backend API ─────────────────────────────────────────────
  backend:
    image: ${BACKEND_IMAGE}
    container_name: memoir_backend
    restart: always
    command: >
      sh -c "
        . /app/.venv/bin/activate &&
        python -m alembic upgrade head &&
        uvicorn src.infrastructure.adapters.driving.main:app --host 0.0.0.0 --port 8000
      "
    environment:
      APP_ENV: production
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      CORS_ORIGINS: "https://testduc.io.vn,https://api.testduc.io.vn"
      APP_BASE_URL: https://api.testduc.io.vn
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-memoir}:${POSTGRES_PASSWORD:-memoir}@postgres:5432/${POSTGRES_DB:-memoirfinance}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-memoirfinance}
      DB_USER: ${POSTGRES_USER:-memoir}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-memoir}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GOOGLE_GEMINI_API_KEY: ${GOOGLE_GEMINI_API_KEY}
      AI_PROVIDER: gemini
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - memoir
    ports:
      - "8000:8000"

volumes:
  postgres_data:
    driver: local

networks:
  memoir:
    driver: bridge
